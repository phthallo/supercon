<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ink</title>
  <meta name="description" content="a shared pixel canvas that shows up on an e-paper badge">
  <script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="primary">
  <header>
    <div class="navbox">
      <div class="row">
        <span class="crumbs">/ <a href="/">home</a> / <a href="/">ink</a></span>
        <span><span id="online" class="muted"></span> <button class="link" id="theme" type="button">[ light ]</button></span>
      </div>
      <hr>
      <nav>
        <a href="#about">[ about ]</a>
        <a href="/badge/frame.png" target="_blank">[ badge view ]</a>
        <a href="/install">[ put it on your badge ]</a>
      </nav>
    </div>
    <h1>ink.</h1>
  </header>

  <main>
    <p>Paint here and it shows up on my Supercon badge! :]<span id="cooldown-note" hidden> You get <b>one stroke every <span id="cooldown">30</span>s</b> :]</span></p>

    <section id="paint" aria-label="canvas">
      <div class="stage-wrap" id="viewport">
        <div class="stage" id="stage">
          <canvas id="canvas" width="960" height="672"></canvas>
        </div>
      </div>
      <div class="toolbar">
        <div class="group" role="radiogroup" aria-label="colour">
          <button class="link swatch" style="--sw:#fff" data-c="0" aria-pressed="false" type="button">[ white ]</button>
          <button class="link swatch" style="--sw:#000" data-c="1" aria-pressed="true" type="button">[ black ]</button>
          <button class="link swatch" style="--sw:#f00" data-c="2" aria-pressed="false" type="button">[ red ]</button>
        </div>
        <div class="group" aria-label="tool">
          <button class="link" data-tool="brush" type="button">[ brush ]</button>
          <button class="link" data-tool="eraser" type="button">[ eraser ]</button>
          <button class="link" data-tool="circle" type="button">[ circle ]</button>
          <button class="link" data-tool="text" type="button">[ text ]</button>
          <button class="link" data-tool="move" type="button">[ move ]</button>
          <input id="text" class="text-input" maxlength="40" placeholder="hello supercon" aria-label="text to place" hidden>
        </div>
        <div class="group" aria-label="size">
          <span class="muted">size</span>
          <button class="link" data-size="1" type="button">[ 1 ]</button>
          <button class="link" data-size="2" type="button">[ 2 ]</button>
          <button class="link" data-size="4" type="button">[ 4 ]</button>
          <button class="link" data-size="8" type="button">[ 8 ]</button>
        </div>
        <div class="group">
          <span id="status" class="status" aria-live="polite">loading…</span>
          <span id="coords" class="muted">x – y –</span>
        </div>
        <div class="group">
          <button class="link" id="zoom-in" type="button" aria-label="zoom in">[ + ]</button>
          <button class="link" id="zoom-out" type="button" aria-label="zoom out">[ − ]</button>
          <button class="link" id="zoom-reset" type="button">[ fit ]</button>
        </div>
      </div>
    </section>
  </main>

  <footer><a href="https://phthallo.com">phthallo</a></footer>
</div>
<script src="/static/theme.js"></script>
<script src="/static/paint.js"></script>
</body>
</html>
