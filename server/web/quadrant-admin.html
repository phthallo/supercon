<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Quadrant</title>
  <script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="primary">
  <header>
    <div class="navbox">
      <div class="row">
        <span class="crumbs">/ <a href="/">quadrant</a> / admin</span>
        <button class="link" id="theme" type="button">[ light ]</button>
      </div>
      <hr>
      <nav>
        <a href="/">[ scores ]</a>
        <a href="/play">[ play ]</a>
      </nav>
    </div>
    <h1>quadrant.</h1>
  </header>

  <main>
    <section class="box">
      <h2>Upload song</h2>
      <form id="upload" class="upload">
        <label>Audio <input type="file" name="audio" accept=".mp3,.ogg,audio/mpeg,audio/ogg"></label>
        <label>Title <input class="text-input" name="title" maxlength="80" placeholder="Undo U"></label>
        <label>Artist <input class="text-input" name="artist" maxlength="80" placeholder="Ninajirachi"></label>
        <label>Charts <input type="file" name="song" accept=".json,application/json"></label>
        <p class="muted">Leave charts empty to generate them from the mp3.</p>
        <label>ID <input class="text-input" name="id" maxlength="40" placeholder="undo-u"></label>
        <div><button class="link" type="submit">[ upload ]</button></div>
        <p id="upload-msg" class="error" role="alert"></p>
      </form>
    </section>

    <section class="box">
      <h2>Songs</h2>
      <div class="table-scroll">
        <table class="board">
          <thead><tr><th>id</th><th>title</th><th>audio</th><th>notes</th><th></th></tr></thead>
          <tbody id="songs"></tbody>
        </table>
      </div>
    </section>

    <section class="box">
      <h2>Recent claims</h2>
      <div class="table-scroll">
        <table class="board">
          <thead><tr><th>name</th><th>song</th><th>score</th><th>ip</th><th></th></tr></thead>
          <tbody id="runs"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src="/static/theme.js"></script>
<script src="/static/quadrant-admin.js"></script>
</body>
</html>
